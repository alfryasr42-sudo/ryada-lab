name: riada_lab
description: تطبيق ميداني لمندوب المختبر - مزامنة المرضى، مسح الباركود، قراءة النتائج OCR، والمراجعة والإرسال.
publish_to: 'none'
version: 1.0.12+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  image: ^4.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  crypto: ^3.0.8
  flutter_local_notifications: 17.2.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
